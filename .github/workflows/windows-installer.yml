name: Build Windows Beta Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version label'
        required: false
        default: '0.9.0-beta'
  pull_request:
    paths:
      - 'app/paths.py'
      - 'app/config.py'
      - 'app/desktop.py'
      - 'desktop_entry.py'
      - 'build_windows_beta.ps1'
      - 'installer/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      POSTAL_AUTOCLIP_HOME: ${{ github.workspace }}/.installer-test-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install packaging tools
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress
          ffmpeg -version
          ffprobe -version
      - name: Build RuneLite companion
        shell: powershell
        run: gradle -p runelite-companion clean testClasses shadowJar --no-daemon
      - name: Build installer
        shell: powershell
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '0.9.0-pr-${{ github.event.pull_request.number }}' }
          .\build_windows_beta.ps1 -Version $version
      - name: Verify installer artifact
        shell: powershell
        run: |
          $file = Get-Item installer/output/PostalAutoClip-Beta-Setup.exe -ErrorAction Stop
          if ($file.Length -lt 1000000) { throw "Installer artifact is unexpectedly small: $($file.Length) bytes" }
          Write-Host "Installer size: $($file.Length) bytes"
      - name: Upload beta installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PostalAutoClip-Windows-Beta-${{ inputs.version }}
          path: installer/output/PostalAutoClip-Beta-Setup.exe
          if-no-files-found: error
          retention-days: 3
