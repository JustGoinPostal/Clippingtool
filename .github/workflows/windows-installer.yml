name: Build Windows Beta Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version label'
        required: true
        default: '0.9.0-beta.1'
      publish_release:
        description: 'Publish/update a GitHub Release for AutoClip updates'
        required: true
        type: boolean
        default: false
  pull_request:
    paths:
      - 'app/paths.py'
      - 'app/config.py'
      - 'app/desktop.py'
      - 'app/secure_store.py'
      - 'app/updater.py'
      - 'app/updater_runner.py'
      - 'app/static/**'
      - 'desktop_entry.py'
      - 'updater_entry.py'
      - 'build_windows_beta.ps1'
      - 'scripts/sign_windows.ps1'
      - 'scripts/inno_sign_file.ps1'
      - 'installer/**'
      - 'pyproject.toml'
      - '.github/workflows/windows-installer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      POSTAL_AUTOCLIP_HOME: ${{ github.workspace }}/.installer-test-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install packaging tools
        shell: powershell
        run: |
          choco install ffmpeg innosetup -y --no-progress
          ffmpeg -version
          ffprobe -version

      - name: Configure disposable CI code-signing certificate
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          $subject = 'CN=Postal AutoClip CI Test'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable -KeyLength 2048 -HashAlgorithm SHA256
          $passwordText = 'PostalAutoClip-CI-Only'
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $pfx = Join-Path $env:RUNNER_TEMP 'postal-autoclip-ci.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'postal-autoclip-ci.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\Root' | Out-Null
          Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\CurrentUser\TrustedPublisher' | Out-Null
          "POSTAL_CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_CODESIGN_PASSWORD=$passwordText" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_CODESIGN_SKIP_TIMESTAMP=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure release code-signing certificate
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        env:
          POSTAL_PFX_B64: ${{ secrets.POSTAL_CODESIGN_PFX_B64 }}
          POSTAL_PFX_PASSWORD: ${{ secrets.POSTAL_CODESIGN_PASSWORD }}
          POSTAL_TIMESTAMP_URL: ${{ secrets.POSTAL_CODESIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:POSTAL_PFX_B64) { throw 'POSTAL_CODESIGN_PFX_B64 GitHub secret is required for manual release builds.' }
          if (-not $env:POSTAL_PFX_PASSWORD) { throw 'POSTAL_CODESIGN_PASSWORD GitHub secret is required for manual release builds.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'postal-autoclip-release.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:POSTAL_PFX_B64))
          $timestamp = if ($env:POSTAL_TIMESTAMP_URL) { $env:POSTAL_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          "POSTAL_CODESIGN_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_CODESIGN_PASSWORD=$env:POSTAL_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_CODESIGN_TIMESTAMP_URL=$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "POSTAL_REQUIRE_SIGNING=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build RuneLite companion
        shell: powershell
        run: gradle -p runelite-companion clean testClasses shadowJar --no-daemon

      - name: Build signed installer and update manifest
        shell: powershell
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '0.9.0-pr-${{ github.event.pull_request.number }}' }
          $tag = "v$version"
          .\build_windows_beta.ps1 -Version $version -ReleaseTag $tag

      - name: Verify signed artifacts and pinned update identity
        shell: powershell
        run: |
          $files = @(
            'dist/PostalAutoClip/PostalAutoClip.exe',
            'dist/PostalAutoClip/PostalAutoClipUpdater.exe',
            'installer/output/PostalAutoClip-Beta-Setup.exe'
          )
          $signatures = @()
          foreach ($path in $files) {
            $file = Get-Item $path -ErrorAction Stop
            if ($file.Length -lt 100000) { throw "Artifact is unexpectedly small: $path ($($file.Length) bytes)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature for $path: $($signature.Status)" }
            if (-not $signature.SignerCertificate.Thumbprint) { throw "Signer thumbprint is missing for $path" }
            $signatures += $signature
            Write-Host "$path :: $($signature.SignerCertificate.Subject) :: $($signature.SignerCertificate.Thumbprint) :: $($file.Length) bytes"
          }
          $expectedThumb = $signatures[0].SignerCertificate.Thumbprint.ToUpperInvariant()
          $expectedSubject = $signatures[0].SignerCertificate.Subject
          foreach ($signature in $signatures) {
            if ($signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $expectedThumb) { throw 'Main app, updater, and installer are not signed by the same certificate.' }
            if ($signature.SignerCertificate.Subject -ne $expectedSubject) { throw 'Main app, updater, and installer signer subjects differ.' }
          }
          $manifest = Get-Content 'installer/output/postal-autoclip-update.json' -Raw | ConvertFrom-Json
          if (-not $manifest.sha256 -or -not $manifest.signer_subject -or -not $manifest.signer_thumbprint -or -not $manifest.installer_url) { throw 'Update manifest is incomplete.' }
          $actual = (Get-FileHash -Algorithm SHA256 'installer/output/PostalAutoClip-Beta-Setup.exe').Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256) { throw 'Update manifest SHA-256 does not match the installer.' }
          if ($manifest.signer_thumbprint.ToUpperInvariant() -ne $expectedThumb) { throw 'Update manifest thumbprint does not match the signed application trust anchor.' }
          if ($manifest.signer_subject -ne $expectedSubject) { throw 'Update manifest subject does not match the signed application trust anchor.' }

      - name: Upload manual beta installer
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PostalAutoClip-Windows-Beta-${{ inputs.version }}
          path: |
            installer/output/PostalAutoClip-Beta-Setup.exe
            installer/output/postal-autoclip-update.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish signed GitHub update release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $tag = "v$version"
          $title = "Postal AutoClip $version"
          $notes = "Signed Postal AutoClip Windows beta. AutoClip verifies HTTPS, SHA-256, Authenticode validity, and the exact certificate thumbprint already trusted by the installed app before applying an update. If the new build fails its installed self-test, the updater restores the previous program build. Creator data under %LOCALAPPDATA%\PostalAutoClip is not replaced by updates."
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes --latest
            gh release upload $tag 'installer/output/PostalAutoClip-Beta-Setup.exe' 'installer/output/postal-autoclip-update.json' --clobber
          } else {
            gh release create $tag 'installer/output/PostalAutoClip-Beta-Setup.exe' 'installer/output/postal-autoclip-update.json' --title $title --notes $notes --latest
          }
