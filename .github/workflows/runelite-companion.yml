name: Build RuneLite Companion

on:
  push:
    paths:
      - 'runelite-companion/**'
      - '.github/workflows/runelite-companion.yml'
  pull_request:
    paths:
      - 'runelite-companion/**'
      - '.github/workflows/runelite-companion.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile against current RuneLite API
        run: gradle -p runelite-companion clean testClasses shadowJar --no-daemon
      - name: Verify runnable package
        shell: bash
        run: |
          JAR="$(ls runelite-companion/build/libs/PostalAutoClipCompanion-*-all.jar | head -n 1)"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^com/postal/autoclip/PostalAutoClipPlugin.class$'
          jar tf "$JAR" | grep -q '^com/postal/autoclip/PostalAutoClipPluginTest.class$'
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -q '^Main-Class: com.postal.autoclip.PostalAutoClipPluginTest$'
      - name: Stage live-test package
        run: |
          mkdir -p runelite-live-test
          cp runelite-companion/build/libs/PostalAutoClipCompanion-*-all.jar runelite-live-test/
          cp runelite-companion/run-windows.bat runelite-live-test/
          cp runelite-companion/build-local.ps1 runelite-live-test/
          cp runelite-companion/LIVE_TEST.md runelite-live-test/
      - name: Upload live-test package
        uses: actions/upload-artifact@v4
        with:
          name: PostalAutoClip-RuneLite-Live-Test
          path: runelite-live-test/
          if-no-files-found: error
          retention-days: 14
