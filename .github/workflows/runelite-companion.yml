name: Build RuneLite Companion

on:
  push:
    paths:
      - 'runelite-companion/**'
      - '.github/workflows/runelite-companion.yml'
  pull_request:
    paths:
      - 'runelite-companion/**'
      - '.github/workflows/runelite-companion.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile against current RuneLite API
        run: gradle -p runelite-companion clean compileJava --no-daemon
