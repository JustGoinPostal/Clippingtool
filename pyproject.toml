[project]
name = "postal-autoclip"
version = "0.9.0"
description = "Local-first automatic stream VOD clipper, social distribution, and audience-learning tool for Shorts/Reels/TikTok"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "faster-whisper>=1.1.0",
  "av<19",
  "httpx>=0.27",
  "numpy>=1.26,<3",
  "google-api-python-client>=2.180",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
postal-autoclip = "app.api:run"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*"]
